[package]
name = "valar-spiral-rs"
version = "0.5.2"
edition = "2021"
authors = ["Samir Menon <menon.samir@gmail.com>"]
homepage = "https://github.com/valargroup/spiral-rs"
repository = "https://github.com/valargroup/spiral-rs"
description = "Fork of spiral-rs: Rust implementation of the Spiral PIR scheme"
keywords = ["privacy", "fhe", "cryptography"]
categories = ["cryptography"]
readme = "README.md"
license = "MIT OR Apache-2.0"

[features]
default = []
server = ["rayon"]
# Opt-in `getrandom` "js" feature for wasm32-unknown-unknown targets.
# Native targets (x86_64, aarch64-apple-darwin, aarch64-apple-ios, etc.) must
# NOT enable this — it pulls in the wasm-bindgen tree.
js = ["getrandom/js"]

[dependencies]
rayon = { version = "1.6.1", optional = true }
getrandom = { version = "0.2.8" }
rand = { version = "0.8.5", features = ["small_rng"] }
serde_json = "1.0"
rand_chacha = "0.3.1"
sha2 = "0.10"
subtle = "2"
fastrand = "2"

[profile.release-with-debug]
inherits = "release"
debug = true
